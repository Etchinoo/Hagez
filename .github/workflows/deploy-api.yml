name: Deploy API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/api/**'
      - 'infra/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/workflows/deploy-api.yml'

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: etchinoo/hagez-api

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      id-token: write   # required for GitHub OIDC -> AWS role assumption
    steps:
      # Deploys over AWS SSM Run Command rather than SSH.
      #
      # Why: SSH from GitHub-hosted runners requires the EC2 security group to
      # allow inbound :22 from GitHub's runner IPs. Those ranges rotate and
      # currently number ~7,300 CIDRs — well past the 1,000-rule hard cap on a
      # security group, so allowlisting them is not possible. SSM inverts the
      # direction: the instance's SSM agent polls AWS outbound, so inbound :22
      # can stay closed to the internet entirely.
      #
      # Setup required before this runs — see infra/SSM_DEPLOY_SETUP.md:
      #   1. instance profile on the EC2 box with AmazonSSMManagedInstanceCore
      #   2. GitHub OIDC provider + deploy role in AWS
      #   3. repo secrets: AWS_DEPLOY_ROLE_ARN, EC2_INSTANCE_ID, AWS_REGION
      #   4. a one-time persistent `docker login ghcr.io` on the instance
      - name: Configure AWS credentials (OIDC — no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM Run Command
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          # NOTE: no credentials are passed in this payload. SSM command
          # parameters are retained in command history and CloudTrail, so the
          # instance authenticates to GHCR from its own persistent
          # ~/.docker/config.json instead (set up once, out of band).
          SCRIPT=$(cat <<'EOS'
          set -e
          cd /opt/hagez
          docker compose pull api
          docker compose up -d --no-deps api
          for i in $(seq 1 20); do
            if curl -fsS http://localhost/health > /dev/null 2>&1; then
              echo "Health check passed"
              exit 0
            fi
            echo "waiting for api... ($i/20)"
            sleep 3
          done
          echo "Health check failed after 60s"
          docker compose logs --tail=50 api
          exit 1
          EOS
          )

          PARAMS=$(jq -n --arg s "$SCRIPT" '{commands: [$s]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy hagez-api @ ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)

          echo "SSM command: $CMD_ID"

          # `wait` exits non-zero when the command fails; swallow it so the
          # remote stdout/stderr can be surfaced before this job fails.
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)

          echo "--- remote stdout ---"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "--- remote stderr ---"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text

          echo "SSM status: $STATUS"
          [ "$STATUS" = "Success" ]
